; Пул PHP-FPM с увеличенным числом воркеров.
;
; Дефолт образа php:*-fpm-alpine — pm.max_children = 5. Страница /dialogi
; параллельно догружает несколько Inertia::defer-групп, каждая ходит в
; удалённый Postgres и держит воркера несколько секунд. Пяти воркеров не
; хватает → перезагрузка документа не получает воркера → nginx отдаёт 502.
;
; Значения можно поднять/опустить под память контейнера (≈40–70 МБ на воркер).

[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Страховка: запрос, зависший дольше 30с, завершается и воркер освобождается
; (наши запросы к БД ограничены statement_timeout=8с, так что это только
; защита от «залипших» воркеров, а не рабочий лимит).
request_terminate_timeout = 30s

catch_workers_output = yes
