; Пул PHP-FPM.
;
; Хост тесный по памяти (≈6 ГБ на весь стек Supabase+n8n+lightrag+app, без swap),
; поэтому число воркеров держим умеренным: каждый ≈40–70 МБ, а всплеск из многих
; воркеров может спровоцировать OOM (→ убитый воркер → 502). 8 хватает для чата
; менеджеров и не грозит переполнением памяти. Поднимать только вместе с RAM/swap.

[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Страховка: запрос, зависший дольше 30с, завершается и воркер освобождается
; (наши запросы к БД ограничены statement_timeout=8с, так что это только
; защита от «залипших» воркеров, а не рабочий лимит).
request_terminate_timeout = 30s

catch_workers_output = yes
php_admin_value[memory_limit] = 256M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/html/storage/logs/php-fpm.log
